<ng-template #topBar let-label="label" let-expanded="expanded">
  <div class="top-left-container">
    <button class="logo-wrap" type="button" (click)="navigate('home')" aria-label="Go to home">
      <span class="cookie-logo" aria-hidden="true"></span>
    </button>
    <div class="menu-btn-container">
      <button
        class="neutral-btn bricolage semibold up"
        (click)="toggleMenu()"
        type="button"
        [attr.aria-expanded]="expanded"
        [attr.aria-label]="
          expanded ? 'Close navigation menu' : 'Open navigation menu'
        "
      >
        <span aria-hidden="true">{{ label }}</span>
      </button>
    </div>
  </div>
</ng-template>

@let color = routeColor();

<div class="navbar-container">
  <div class="navbar-content" [class]="color">
    <ng-container
      [ngTemplateOutlet]="topBar"
      [ngTemplateOutletContext]="{ label: 'MENU', expanded: menuOpen() }"
    ></ng-container>
    <button
      class="chat-btn neutral-btn"
      type="button"
      (click)="navigate('contact')"
      aria-label="Contact me"
    >
      <svg
        class="chat-icon"
        viewBox="0 0 1024 1024"
        fill="none"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle class="icon-bg" cx="512" cy="512" r="460"/>
        <path class="icon-fg" d="M362.666667 640a32 32 0 0 1 0-64h170.666666a32 32 0 0 1 0 64h-170.666666z m0-192a32 32 0 0 1 0-64h298.666666a32 32 0 0 1 0 64H362.666667z m455.786666 390.784l28.096 60.586667A42.666667 42.666667 0 0 1 807.850667 960H512C264.576 960 64 759.424 64 512S264.576 64 512 64s448 200.576 448 448a446.762667 446.762667 0 0 1-141.546667 326.784zM512 896h262.442667l-14.037334-30.293333a64 64 0 0 1 14.272-73.6A382.698667 382.698667 0 0 0 896 512c0-212.074667-171.925333-384-384-384S128 299.925333 128 512s171.925333 384 384 384z"/>
      </svg>
      <span class="chat-label">CONTACT ME</span>
    </button>
  </div>
</div>

<div
  class="route-transition"
  [class.show]="pageTransition.startTransition()"
  [style.background-color]="pageTransition.transitionColor()"
></div>

<div class="loader-dots" [class.show]="pageTransition.showDots()">
  <span class="dot"></span>
  <span class="dot"></span>
</div>

@if (menuOpen()) {
  <div class="menu-overlay" (click)="toggleMenu()" role="presentation">
    <div
      class="menu-container"
      role="dialog"
      aria-modal="true"
      aria-label="Navigation menu"
      [class]="color"
      (click)="$event.stopPropagation()"
    >
      <div class="menu-content">
        <div class="menu-top-content">
          <ng-container
            [ngTemplateOutlet]="topBar"
            [ngTemplateOutletContext]="{ label: 'CLOSE', expanded: menuOpen() }"
          ></ng-container>
        </div>
        <!-- social profiles -->
        <ul class="socials" aria-label="Social profiles">
          @for (s of socials; track s.name) {
            <li>
              <a
                class="social-link"
                [href]="s.url"
                target="_blank"
                rel="noopener noreferrer"
                [attr.aria-label]="s.label + ' (opens in a new tab)'"
                [style.--i]="$index"
              >
                <span [class]="'icon icon-' + s.name" aria-hidden="true"></span>
                <span class="social-name">{{ s.label }}</span>
              </a>
            </li>
          }
        </ul>

        <!-- IntelliJ "Project"-style file list: files joined by tree guide lines -->
        <nav class="explorer" aria-label="Main">
          <ul class="tree">
            @for (item of menuItems; track item.path; let i = $index) {
              <li
                class="tree-item"
                [style.--i]="i"
                [class.active]="currentRoute() === item.path"
              >
                <button
                  type="button"
                  class="tree-btn"
                  (click)="navigate(item.path)"
                  [attr.aria-current]="currentRoute() === item.path ? 'page' : null"
                  [attr.aria-keyshortcuts]="i + 1"
                >
                  <span class="tree-icon" aria-hidden="true">TS</span>
                  <span class="tree-name heading1">{{ item.label }}<span class="tree-ext" aria-hidden="true">.ts</span></span>
                  <span class="tree-comment"><span aria-hidden="true">// </span>{{ item.desc }}</span>
                  @if (currentRoute() === item.path) {
                    <span class="tree-open" aria-hidden="true">open</span>
                  }
                  <kbd class="tree-key" aria-hidden="true">{{ i + 1 }}</kbd>
                </button>
              </li>
            }
          </ul>
        </nav>

        <div class="status-bar" aria-hidden="true">
          <span>⎇ main</span>
          <span class="status-sep"></span>
          <span>{{ menuItems.length }} files</span>
          <span class="status-hint"><kbd>1</kbd>–<kbd>4</kbd> open · <kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>
  </div>
}
